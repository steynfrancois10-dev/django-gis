<!-- FarmApp/templates/FarmApp/farm_form.html -->
{% extends "FarmApp/base.html" %}
{% block title %}{{ action }} Farm{% endblock %}

{% block content %}
<h2>{{ action }} Farm</h2>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}

  <button type="submit" class="btn btn-success">{{ action }}</button>
  <a href="{% url 'FarmApp:farm-list' %}" class="btn btn-secondary">Back to list</a>
</form>
{% endblock %}
