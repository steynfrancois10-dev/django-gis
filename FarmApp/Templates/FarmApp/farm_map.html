<!-- FarmApp/templates/FarmApp/farm_map.html -->
{% extends "FarmApp/base.html" %}
{% block content %}
<h3>Farm & Crop Map</h3>

<div id="map" style="height: 600px;"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

<script>
function getCookie(name) {
    // standard cookie getter
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
const csrftoken = getCookie('csrftoken');

// Initialize map
var map = L.map('map').setView([-26.7, 27.1], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

var drawnItems = new L.FeatureGroup().addTo(map);

var drawControl = new L.Control.Draw({
    edit: { featureGroup: drawnItems },
    draw: { polygon: true, rectangle: true, marker: true, polyline: false, circle: false }
});
map.addControl(drawControl);

// load existing shapes
fetch("{% url 'FarmApp:get_geojson' %}")
.then(r => r.json())
.then(data => {
    data.farms.forEach(f => {
        if (f.geojson) {
            L.geoJSON(f.geojson, {
                style: { color: "green", weight: 2 },
                onEachFeature: (feature, layer) => {
                    layer.bindPopup("Farm: " + f.name);
                }
            }).addTo(map);
        }
    });
    data.crops.forEach(c => {
        if (c.geojson) {
            L.geoJSON(c.geojson, {
                style: { color: "yellow", weight: 2 },
                onEachFeature: (feature, layer) => {
                    layer.bindPopup("Crop: " + c.name);
                }
            }).addTo(map);
        }
    });
});

// on draw create, ask for type and name then post to server
map.on(L.Draw.Event.CREATED, function (event) {
    var layer = event.layer;
    drawnItems.addLayer(layer);

    var type = prompt("Type 'farm' for boundary (polygon) or 'crop' for crop marker:");
    if (!type) { alert("No type provided — shape not saved."); return; }
    type = type.toLowerCase().trim();
    if (type !== 'farm' && type !== 'crop') {
        alert("Invalid type. Use 'farm' or 'crop'.");
        return;
    }

    var name = prompt("Enter a name for this " + type + ":");
    if (!name) name = "Unnamed";

    var geojson = layer.toGeoJSON();
    fetch("{% url 'FarmApp:save_geojson' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken
        },
        body: JSON.stringify({
            geojson: geojson.geometry,
            type: type,
            name: name
        })
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === "success") {
            alert(type + " saved (id: " + data.id + ")");
        } else {
            alert("Save error: " + (data.error || JSON.stringify(data)));
        }
    })
    .catch(err => {
        console.error(err);
        alert("Network or server error saving geometry.");
    });
});
</script>

{% endblock %}
